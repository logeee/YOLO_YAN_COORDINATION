<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>G1-D 遥控面板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="control-shell">
      <section class="control-panel" aria-label="G1-D 控制面板">
        <header class="topbar">
          <div class="title-block">
            <h1>G1-D 遥控面板</h1>
            <p id="modeText">读取服务状态中</p>
          </div>
          <button id="stopBtn" class="stop-button" type="button">STOP</button>
        </header>

        <section class="status-band" aria-label="状态">
          <div class="status-card robot-card">
            <span>机器人</span>
            <strong id="robotIp">读取中</strong>
          </div>
          <div class="status-card">
            <span>模式</span>
            <strong id="executeMode" class="mode-badge">-</strong>
          </div>
          <div class="status-card">
            <span>最后动作</span>
            <strong id="lastAction">无</strong>
          </div>
        </section>

        <div class="workspace-grid">
          <section class="pad-section drive-section" aria-label="移动控制">
            <div class="section-title">
              <h2>底盘移动</h2>
            </div>
            <div class="drive-pad">
              <button class="control-button forward" type="button" data-action="forward">
                <span class="button-symbol">↑</span>
                <span>前进</span>
              </button>
              <button class="control-button left" type="button" data-action="turn_left">
                <span class="button-symbol">↺</span>
                <span>左转</span>
              </button>
              <button class="control-button back" type="button" data-action="back">
                <span class="button-symbol">↓</span>
                <span>后退</span>
              </button>
              <button class="control-button right" type="button" data-action="turn_right">
                <span class="button-symbol">↻</span>
                <span>右转</span>
              </button>
            </div>
          </section>

          <aside class="side-stack">
            <section class="pad-section column-section" aria-label="升降柱控制">
              <div class="section-title">
                <h2>升降柱</h2>
              </div>
              <div class="column-pad">
                <button class="control-button column-up" type="button" data-action="column_up">
                  <span class="button-symbol">⇧</span>
                  <span>升</span>
                </button>
                <button class="control-button column-down" type="button" data-action="column_down">
                  <span class="button-symbol">⇩</span>
                  <span>降</span>
                </button>
              </div>
            </section>

            <section class="settings-panel" aria-label="参数">
              <h2>参数</h2>
              <label>
                <span>速度</span>
                <input id="commandSpeed" type="range" min="0" max="1" step="0.01" value="0.2" />
                <output id="commandSpeedValue">0.20</output>
              </label>
            </section>
          </aside>
        </div>

        <section class="log-section" aria-label="日志">
          <div class="log-title">
            <h2>命令回显</h2>
            <button id="clearLogBtn" type="button">清空</button>
          </div>
          <pre id="logBox">等待操作</pre>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
